name: CraftStudio
options:
  bundleIdPrefix: studio.craft
  deploymentTarget:
    iOS: '17.0'
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.89.0
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2.git
    exactVersion: 0.5.15
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: C265XC3RH7
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: '2.5'
    CURRENT_PROJECT_VERSION: '2026092601'
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
targets:
  CraftStudio:
    type: application
    platform: iOS
    sources:
      - CraftStudio/Sources
      - path: CraftStudio/Resources
        buildPhase: resources
    entitlements:
      path: CraftStudio/Configuration/CraftStudio.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        aps-environment: $(APS_ENVIRONMENT)
        keychain-access-groups:
          - $(AppIdentifierPrefix)studio.craft.ios
    dependencies:
      - target: CraftStudioWidgets
      - package: GLTFKit2
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
    settings:
      configs:
        Debug:
          APS_ENVIRONMENT: development
          "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) $(SDKROOT)/Developer/Library/Frameworks"
          "LD_RUNPATH_SEARCH_PATHS[sdk=iphonesimulator*]": "$(inherited) @executable_path/Frameworks $(PLATFORM_DIR)/Developer/Library/Frameworks $(PLATFORM_DIR)/Developer/Library/PrivateFrameworks"
        Release:
          APS_ENVIRONMENT: production
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.craft.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: 3D Craft
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to turn your idea into a 3D asset.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose reference photos for your creations.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: CraftStudio/Configuration/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CraftStudioAPIURL: https://3d-craft.web.app
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: studio.craft.ios
            CFBundleURLSchemes:
              - studio.craft.ios
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  CraftStudioWidgets:
    type: app-extension
    platform: iOS
    sources:
      - CraftStudioWidgets/Sources
      # The activity and gadget models are shared with the app so both encode the same state.
      - path: CraftStudio/Sources/CraftGenerationActivity.swift
      - path: CraftStudio/Sources/CraftGadgetCenter.swift
      - path: CraftStudioWidgets/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.craft.ios.widgets
        INFOPLIST_KEY_CFBundleDisplayName: 3D Craft
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SKIP_INSTALL: YES
    entitlements:
      path: CraftStudioWidgets/CraftStudioWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)studio.craft.ios
    info:
      path: CraftStudioWidgets/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  CraftStudioTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CraftStudio/Tests
    dependencies:
      - target: CraftStudio
  CraftStudioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CraftStudio/UITests
    dependencies:
      - target: CraftStudio
schemes:
  CraftStudio:
    build:
      targets:
        CraftStudio: all
        CraftStudioWidgets: all
        CraftStudioTests: [test]
        CraftStudioUITests: [test]
    run:
      config: Debug
      environmentVariables:
        DYLD_FRAMEWORK_PATH: "$(PLATFORM_DIR)/Developer/Library/Frameworks:$(PLATFORM_DIR)/Developer/Library/PrivateFrameworks"
    test:
      config: Debug
      targets: [CraftStudioTests, CraftStudioUITests]
